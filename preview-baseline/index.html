<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>網元料理 あさまる｜湘南・茅ヶ崎</title>
  <link rel="icon" href="../images/favicon.png">
  <link rel="stylesheet" href="baseline.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="section split hero" aria-labelledby="hero-title">
      <div class="stack">
        <p class="note">湘南・茅ヶ崎</p>
        <h1 id="hero-title">網元料理 あさまる</h1>
        <p>板前が仕込む、地魚と季節の和食居酒屋</p>
        <a class="button" href="tel:0467883751">電話で予約</a>
      </div>
      <img src="../images/exterior-nobori.jpg" width="1108" height="1477" alt="店先の幟と瓦屋根の外観" fetchpriority="high">
    </section>
    <section class="section ruled split" aria-labelledby="dish-title">
      <div class="stack">
        <h2 id="dish-title">定番の品</h2>
        <h3>本日のオススメ5点刺盛り</h3>
      </div>
      <img class="dish" src="../images/dish-sashimi.jpg" width="1072" height="939" alt="本日のオススメ5点刺盛り">
    </section>
    <section class="section ruled split" aria-labelledby="visit-title">
      <div class="stack">
        <h2 id="visit-title">営業のご案内</h2>
        <dl class="hours">
          <dt>昼</dt><dd>11:30–15:00（L.O.14:30）</dd>
          <dt>夜</dt><dd>17:00–22:00（L.O.20:30）</dd>
          <dt>定休日</dt><dd>火曜（月曜夜は不定休）</dd>
        </dl>
      </div>
      <div class="stack">
        <h2>ご予約</h2>
        <a class="button" href="tel:0467883751">0467-88-3751</a>
      </div>
    </section>
  </main>
</body>
</html>
